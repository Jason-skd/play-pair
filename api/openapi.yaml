openapi: 3.0.3
info:
  title: PlayPair API
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      responses:
        '204': {description: Logged out}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/profile:
    get:
      operationId: getProfile
      security:
        - CookieSession: []
      responses:
        '200':
          description: Current user's display profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: putProfile
      security:
        - CookieSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfile'}
      responses:
        '200':
          description: Replaced profile with incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/preferences:
    get:
      operationId: getPreferences
      security:
        - CookieSession: []
      responses:
        '200':
          description: Current user's preference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preference'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: putPreferences
      security:
        - CookieSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePreference'}
      responses:
        '200':
          description: Replaced preference with incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preference'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      operationId: me
      security:
        - CookieSession: []
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    get:
      operationId: ready
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: playpair_session
  parameters:
    BrowserWriteHeader:
      name: X-PlayPair-Request
      in: header
      required: true
      schema: {type: string, enum: ['1']}
  responses:
    UserResponse:
      description: Authenticated user
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/User'}
    Healthy:
      description: Available
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Error:
      description: Request failed
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SoftPreferences:
      type: object
      additionalProperties: false
      required: [likes, neutral, dislikes]
      properties:
        likes: {type: string, maxLength: 500}
        neutral: {type: string, maxLength: 500}
        dislikes: {type: string, maxLength: 500}
    HardDefaults:
      description: Optional defaults only; saving does not authorize any outing. Currency is CNY, measured in fen.
      type: object
      additionalProperties: false
      required: [maxBudgetFen, requiresWheelchairAccess]
      properties:
        maxBudgetFen: {type: integer, format: int64, minimum: 0, nullable: true}
        requiresWheelchairAccess: {type: boolean, nullable: true}
    Preference:
      type: object
      additionalProperties: false
      required: [soft, hardDefaults, version]
      properties:
        soft: {$ref: '#/components/schemas/SoftPreferences'}
        hardDefaults: {$ref: '#/components/schemas/HardDefaults'}
        version: {type: integer, format: int64, minimum: 1}
    UpdatePreference:
      type: object
      additionalProperties: false
      required: [soft, hardDefaults, expectedVersion]
      properties:
        soft: {$ref: '#/components/schemas/SoftPreferences'}
        hardDefaults: {$ref: '#/components/schemas/HardDefaults'}
        expectedVersion: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775806}
    Profile:
      type: object
      additionalProperties: false
      required: [displayName, nickname, version]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        nickname: {type: string, nullable: true, maxLength: 80}
        version: {type: integer, format: int64, minimum: 1}
    UpdateProfile:
      type: object
      additionalProperties: false
      required: [displayName, nickname, expectedVersion]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        nickname: {type: string, nullable: true, maxLength: 80}
        expectedVersion: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775806}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 15, maxLength: 512}
        displayName: {type: string, minLength: 1, maxLength: 320}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 15, maxLength: 512}
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, createdAt]
      properties:
        id: {type: integer, format: int64, minimum: 1, description: Database-generated account identity.}
        email: {type: string, format: email}
        displayName: {type: string, minLength: 1}
        createdAt: {type: string, format: date-time}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [invalid_input, version_conflict, email_conflict, invalid_credentials, unauthenticated, forbidden, rate_limited, csrf_rejected, dependency_unavailable, not_found, method_not_allowed, internal_error]
            message: {type: string, minLength: 1}
            requestId: {type: string, minLength: 1}
