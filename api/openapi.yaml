openapi: 3.0.3
info:
  title: PlayPair API
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    get:
      operationId: ready
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Healthy:
      description: Available
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Error:
      description: Request failed
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [dependency_unavailable, not_found, method_not_allowed, internal_error]
            message: {type: string, minLength: 1}
            requestId: {type: string, minLength: 1}
