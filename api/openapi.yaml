openapi: 3.0.3
info:
  title: PlayPair API
  version: 0.1.0
paths:
  "/api/v1/groups/{groupId}/outings":
    post:
      operationId: createOuting
      description: Publish as a current group member. No response rows are created.
        Dates use the immutable IANA timezone. Body limit 64 KiB; 20 writes per actor
        and operation per 10 minutes.
      security:
      - CookieSession: []
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - &outingWriteHeader
        "$ref": "#/components/parameters/BrowserWriteHeader"
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Outing"
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateOutingRequest"
  "/api/v1/outings":
    get:
      operationId: listOutings
      description: Visible outings, including retained responses after leaving a group.
        Optional groupId filters the source group, without changing access. Ordered
        by id.
      security:
      - CookieSession: []
      parameters:
      - name: groupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: afterId
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - &outingPageLimit
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OutingPage"
        default:
          "$ref": "#/components/responses/Error"
  "/api/v1/outings/{outingId}":
    get:
      operationId: getOuting
      description: 'Outing and own responses/input in both rounds. Warnings are computed
        only during decision. Missing decisions after arrangement creation are not_participated.
        Access: organizer, current group member, decision respondent, or existing confirmation
        row (including reset rows).'
      security:
      - CookieSession: []
      parameters:
      - &outingIdParameter
        name: outingId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OutingDetail"
        default:
          "$ref": "#/components/responses/Error"
    put:
      operationId: updateOuting
      description: Organizer replaces dates and duration before start. Timezone, group
        and organizer cannot change. Existing inputs are retained even when outside
        the new dates.
      security:
      - CookieSession: []
      parameters:
      - *outingIdParameter
      - *outingWriteHeader
      responses:
        '204':
          description: Saved
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OutingPlan"
  "/api/v1/outings/{outingId}/decision-inputs":
    get:
      operationId: getDecisionInputs
      description: >-
        Organizer-only current-input aggregation before arrangement creation. Reads the
        plan and all first-round Accept inputs in one repeatable-read transaction,
        including respondents who left the group. Deny and unanswered members do not
        participate; waiting for the entire group is not required. No result is persisted.
        Budgets use CNY fen per person for the whole outing. Stale dates are excluded
        without dropping participants. Intervals are half-open and consecutive dates
        can form a window across midnight and must allow the current duration.
        The result contains common conditions and constraint sources only; member
        input and derived start times are not returned. Proposal starts follow the
        outing timezone's half-hour grid. At most 128 participants and 256 intervals
        per member; overflow is never truncated.
        No inputs, malformed inputs, no feasible common time and capacity overflow
        have distinct errors. IDs are stable for equal normalized inputs and config.
        Soft preferences are not hard constraints. The Go ValidateProposal contract
        is an internal boundary for recommendation consumers, not a persistence API.
      security:
      - CookieSession: []
      parameters:
      - *outingIdParameter
      responses:
        '200':
          description: Current aggregation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DecisionInputs"
        default:
          "$ref": "#/components/responses/Error"
  "/api/v1/outings/{outingId}/responses":
    get:
      operationId: listOutingResponses
      description: Both rounds, optional phase/status filters. Pending is derived before
        filtering and pagination. No private inputs. Ordered by memberId then phase;
        confirmation summaries exist only after an arrangement; decision summaries after
        that contain actual decision respondents only.
      security:
      - CookieSession: []
      parameters:
      - *outingIdParameter
      - name: phase
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/OutingPhase"
      - name: status
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/ResponseStatus"
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - *outingPageLimit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ResponsePage"
        default:
          "$ref": "#/components/responses/Error"
  "/api/v1/outings/{outingId}/members/{memberId}":
    get:
      operationId: getOutingMember
      description: Full responses and input visible only to that member or organizer.
        Decision input remains readable during confirmation; warnings are returned only
        during decision.
      security:
      - CookieSession: []
      parameters:
      - *outingIdParameter
      - name: memberId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OutingMember"
        default:
          "$ref": "#/components/responses/Error"
  "/api/v1/outings/{outingId}/responses/decision":
    put:
      operationId: respondDecision
      description: Own decision only, during decision phase. Accept requires explicit
        complete input; deny forbids input and removes previous input. Half-hour local
        intervals must use current candidate dates; overlaps are merged. Last serialized
        write wins; no version or idempotency key.
      security:
      - CookieSession: []
      parameters:
      - *outingIdParameter
      - *outingWriteHeader
      responses:
        '204':
          description: Saved
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DecisionRequest"
  "/api/v1/outings/{outingId}/responses/confirmation":
    put:
      operationId: respondConfirmation
      description: Own accept/deny for the current arrangement before its start. No
        first-round input is changed. A new response creates a row; reset rows retain
        access.
      security:
      - CookieSession: []
      parameters:
      - *outingIdParameter
      - *outingWriteHeader
      responses:
        '204':
          description: Saved
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ConfirmationRequest"
  "/api/v1/outings/{outingId}/arrangement":
    post:
      operationId: createArrangement
      description: Organizer manually records the chosen future arrangement and opens
        confirmation. Does not generate candidates or create response rows.
      security:
      - CookieSession: []
      parameters:
      - *outingIdParameter
      - *outingWriteHeader
      responses:
        '201':
          description: Saved
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Arrangement"
    put:
      operationId: updateArrangement
      description: 'Organizer updates an existing arrangement before its current start.
        resetResponses is required: true clears every confirmation choice but retains
        rows/access; false preserves choices under organizer responsibility. New start
        must also be in the future.'
      security:
      - CookieSession: []
      parameters:
      - *outingIdParameter
      - *outingWriteHeader
      responses:
        '204':
          description: Saved
        default:
          "$ref": "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateArrangement"
  /api/v1/groups:
    post:
      operationId: createGroup
      description: Create a persistent friend group. Same actor/key/name replays without changing timestamps; a different normalized name returns 409 idempotency_conflict. Keys have no expiry. Body limit 8 KiB; 20 requests per actor per 10 minutes.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGroupRequest'}
      responses:
        '201': {$ref: '#/components/responses/GroupResponse'}
        '200': {$ref: '#/components/responses/GroupResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/join:
    post:
      operationId: joinGroup
      description: Join using only the code. Repeated joins preserve membership and timestamps. Body limit 8 KiB; 20 requests per actor per 10 minutes, independently of creation.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JoinGroupRequest'}
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/{groupId}:
    get:
      operationId: getGroup
      description: All members can read and share the join code. Existing groups return 403 to nonmembers; missing groups return 404.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/{groupId}/members:
    get:
      operationId: getGroupMembers
      description: Members only. Current profile projection, sorted by memberId ascending; no email or preferences. No membership row means no access.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: afterMemberId
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: A page of current members
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupMemberPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/register:
    post:
      operationId: register
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      responses:
        '204': {description: Logged out}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/profile:
    get:
      operationId: getProfile
      security:
        - CookieSession: []
      responses:
        '200':
          description: Current user's display profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: putProfile
      security:
        - CookieSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfile'}
      responses:
        '200':
          description: Replaced profile with incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/preferences:
    get:
      operationId: getPreferences
      security:
        - CookieSession: []
      responses:
        '200':
          description: Current user's preference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preference'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: putPreferences
      security:
        - CookieSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePreference'}
      responses:
        '200':
          description: Replaced preference with incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preference'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      operationId: me
      security:
        - CookieSession: []
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    get:
      operationId: ready
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: playpair_session
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    BrowserWriteHeader:
      name: X-PlayPair-Request
      in: header
      required: true
      schema: {type: string, enum: ['1']}
  responses:
    GroupResponse:
      description: Group visible to the authenticated member
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Group'}
    UserResponse:
      description: Authenticated user
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/User'}
    Healthy:
      description: Available
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Error:
      description: Request failed
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    TimeWindow:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
    ConstraintSource:
      type: object
      additionalProperties: false
      required: [memberId, field]
      properties:
        memberId:
          type: integer
          format: int64
          minimum: 0
          description: Zero denotes the outing plan; positive IDs denote member input.
        field:
          type: string
          enum: [dates, durationMinutes, availability, maxBudgetFen, requiresWheelchairAccess]
    HardConstraint:
      type: object
      additionalProperties: false
      required: [constraintId, type, scope, sources]
      description: >-
        Type selects the sole parameter: budget uses maxBudgetFen, common_time uses
        windows, duration uses durationMinutes, wheelchair_access requires accessible
        venue and has no additional parameter. All constraints need exactly one
        satisfied/violated/unknown answer with evidence or reason in Go ValidateProposal.
        Missing/duplicate/unknown IDs or invalid statuses are contract errors. Go
        rechecks structured facts; unknown facts stay pending and known violations
        reject the proposal. Accepted proposals promise no identified conflict, with
        pending conditions requiring confirmation. No arrangement is written.
      properties:
        constraintId: {type: string, minLength: 1, maxLength: 128}
        type: {type: string, enum: [budget, common_time, duration, wheelchair_access]}
        scope: {type: string, enum: [per_person_whole_outing, venue, schedule]}
        maxBudgetFen: {type: integer, format: int64, minimum: 0}
        durationMinutes: {type: integer, minimum: 30, maximum: 1440, multipleOf: 30}
        windows:
          type: array
          items:
            "$ref": "#/components/schemas/TimeWindow"
        sources:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/ConstraintSource"
    DecisionInputs:
      type: object
      additionalProperties: false
      required: [outingId, timezone, durationMinutes, maxBudgetFen, requiresWheelchairAccess, commonWindows, constraints]
      properties:
        outingId: {type: integer, format: int64, minimum: 1}
        timezone: {type: string}
        durationMinutes: {type: integer}
        maxBudgetFen: {type: integer, format: int64, minimum: 0}
        requiresWheelchairAccess: {type: boolean}
        commonWindows:
          type: array
          items:
            "$ref": "#/components/schemas/TimeWindow"
        constraints:
          type: array
          minItems: 3
          maxItems: 4
          items:
            "$ref": "#/components/schemas/HardConstraint"
    OutingPhase:
      type: string
      enum:
      - decision
      - confirmation
    OutingChoice:
      type: string
      enum:
      - accept
      - deny
    ResponseStatus:
      type: string
      enum:
      - pending
      - accept
      - deny
    OutingPlan:
      type: object
      additionalProperties: false
      required:
      - dates
      - durationMinutes
      properties:
        dates: &outingDates
          type: array
          items:
            type: string
            format: date
          minItems: 1
          maxItems: 31
        durationMinutes: &outingDuration
          type: integer
          minimum: 30
          maximum: 1440
          multipleOf: 30
    CreateOutingRequest:
      type: object
      additionalProperties: false
      required:
      - dates
      - durationMinutes
      - timezone
      properties:
        dates: *outingDates
        durationMinutes: *outingDuration
        timezone:
          type: string
    OutingAvailability:
      type: object
      additionalProperties: false
      required:
      - date
      - startTime
      - endTime
      properties:
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
    OutingInput:
      type: object
      additionalProperties: false
      required:
      - maxBudgetFen
      - requiresWheelchairAccess
      - availability
      properties:
        maxBudgetFen:
          type: integer
          format: int64
          minimum: 0
        requiresWheelchairAccess:
          type: boolean
        availability:
          type: array
          items:
            "$ref": "#/components/schemas/OutingAvailability"
          minItems: 1
          maxItems: 256
    DecisionRequest:
      type: object
      additionalProperties: false
      required:
      - choice
      properties:
        choice:
          "$ref": "#/components/schemas/OutingChoice"
        input:
          "$ref": "#/components/schemas/OutingInput"
    ConfirmationRequest:
      type: object
      additionalProperties: false
      required:
      - choice
      properties:
        choice:
          "$ref": "#/components/schemas/OutingChoice"
    Arrangement:
      type: object
      additionalProperties: false
      required:
      - startsAt
      - endsAt
      - place
      - activity
      properties:
        startsAt: &arrangementStart
          type: string
          format: date-time
        endsAt: &arrangementEnd
          type: string
          format: date-time
        place: &arrangementPlace
          type: string
          minLength: 1
          maxLength: 500
        activity: &arrangementActivity
          type: string
          minLength: 1
          maxLength: 500
    UpdateArrangement:
      type: object
      additionalProperties: false
      required:
      - startsAt
      - endsAt
      - place
      - activity
      - resetResponses
      properties:
        startsAt: *arrangementStart
        endsAt: *arrangementEnd
        place: *arrangementPlace
        activity: *arrangementActivity
        resetResponses:
          type: boolean
    OutingWarning:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - date_outside_plan
          - no_sufficient_availability
        availabilityIndex:
          type: integer
          minimum: 0
    OutingMember:
      type: object
      additionalProperties: false
      required:
      - memberId
      - decision
      - confirmation
      - warnings
      properties:
        memberId:
          type: integer
          format: int64
          minimum: 1
        decision:
          type: string
          enum:
          - pending
          - accept
          - deny
          - not_participated
        confirmation:
          type: string
          enum:
          - pending
          - accept
          - deny
          - not_started
        input:
          "$ref": "#/components/schemas/OutingInput"
        warnings:
          type: array
          items:
            "$ref": "#/components/schemas/OutingWarning"
    Outing:
      type: object
      additionalProperties: false
      required:
      - id
      - groupId
      - initiatorId
      - timezone
      - dates
      - durationMinutes
      - createdAt
      - status
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        groupId:
          type: integer
          format: int64
          minimum: 1
        initiatorId:
          type: integer
          format: int64
          minimum: 1
        timezone:
          type: string
        dates:
          type: array
          items:
            type: string
            format: date
        durationMinutes:
          type: integer
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - decision
          - confirmation
          - archived
        arrangement:
          "$ref": "#/components/schemas/Arrangement"
    OutingDetail:
      type: object
      additionalProperties: false
      required:
      - outing
      - member
      properties:
        outing:
          "$ref": "#/components/schemas/Outing"
        member:
          "$ref": "#/components/schemas/OutingMember"
    OutingPage:
      type: object
      additionalProperties: false
      required:
      - outings
      properties:
        outings:
          type: array
          items:
            "$ref": "#/components/schemas/Outing"
        nextAfterId:
          type: integer
          format: int64
          minimum: 1
    ResponseSummary:
      type: object
      additionalProperties: false
      required:
      - memberId
      - phase
      - status
      properties:
        memberId:
          type: integer
          format: int64
          minimum: 1
        phase:
          "$ref": "#/components/schemas/OutingPhase"
        status:
          "$ref": "#/components/schemas/ResponseStatus"
    ResponsePage:
      type: object
      additionalProperties: false
      required:
      - responses
      properties:
        responses:
          type: array
          items:
            "$ref": "#/components/schemas/ResponseSummary"
        nextCursor:
          type: string
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, description: Trim surrounding Unicode whitespace; reject NUL and invalid UTF-8.}
    JoinGroupRequest:
      type: object
      additionalProperties: false
      required: [joinCode]
      properties:
        joinCode: {type: string, description: Trim surrounding whitespace and uppercase ASCII before validating 16 Base32 characters. Never place in URLs or logs.}
    Group:
      type: object
      additionalProperties: false
      required: [id, name, joinCode, initiatorId, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 80}
        joinCode: {type: string, pattern: '^[A-Z2-7]{16}$'}
        initiatorId: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time, description: Latest actual group or membership change; nondecreasing but not a version or commit sequence.}
    GroupMember:
      type: object
      additionalProperties: false
      required: [memberId, role, joinedAt, displayName, nickname]
      properties:
