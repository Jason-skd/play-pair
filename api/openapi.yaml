openapi: 3.0.3
info:
  title: PlayPair API
  version: 0.1.0
paths:
  /api/v1/groups/{groupId}/outings:
    post:
      operationId: createOuting
      description: Any group member may publish. Atomically invites all members, including the publisher. Same actor/key/content replays with 200; different content returns 409. Dates are sorted and deduplicated. No implicit timezone. Body limit 64 KiB; 20 writes per actor and operation per 10 minutes.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/BrowserWriteHeader'
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOutingRequest'}
      responses:
        '201': {$ref: '#/components/responses/OutingResponse'}
        '200': {$ref: '#/components/responses/OutingResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/outings/{outingId}:
    get:
      operationId: getOuting
      description: Group members only. Includes only the current user's inputs. Status is computed at response time; archived at startsAt, not endsAt. Arrangement is immutable and has no creation endpoint in this release.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/OutingId'
      responses:
        '200': {$ref: '#/components/responses/OutingResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/outings/{outingId}/invitations:
    get:
      operationId: getOutingInvitations
      description: Group members only. Summaries exclude every member's input. Cursor orders by outingId, memberId, phase.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/OutingId'
        - $ref: '#/components/parameters/InvitationCursor'
        - $ref: '#/components/parameters/InvitationLimit'
      responses:
        '200': {$ref: '#/components/responses/InvitationPageResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/invitations:
    get:
      operationId: getMyInvitations
      description: Current user's invitations in both rounds, including historical responses. Joining a group adds the current round for outings not yet archived. No push notifications.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/InvitationCursor'
        - $ref: '#/components/parameters/InvitationLimit'
      responses:
        '200': {$ref: '#/components/responses/InvitationPageResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/outings/{outingId}/invitations/{phase}:
    put:
      operationId: respondOuting
      description: Respond only for the authenticated member. Decision acceptance requires complete input; confirmation acceptance and all refusals forbid input. Use rejected before acceptance, declined after acceptance; both may accept again. Input changes retain acceptedAt; refusal clears it. Identical normalized retries preserve timestamps/version, otherwise expectedVersion must match. Version is an opaque increasing revision. Previous rounds are frozen and archived outings reject writes, even retries. Phase/cutoff checks use database time after locks. Body limit 64 KiB; 20 writes per actor and operation per 10 minutes.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/OutingId'
        - {name: phase, in: path, required: true, schema: {$ref: '#/components/schemas/InvitationPhase'}}
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RespondOutingRequest'}
      responses:
        '200':
          description: Current response including own input when applicable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invitation'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups:
    post:
      operationId: createGroup
      description: Create a persistent friend group. Same actor/key/name replays without changing timestamps; a different normalized name returns 409 idempotency_conflict. Keys have no expiry. Body limit 8 KiB; 20 requests per actor per 10 minutes.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGroupRequest'}
      responses:
        '201': {$ref: '#/components/responses/GroupResponse'}
        '200': {$ref: '#/components/responses/GroupResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/join:
    post:
      operationId: joinGroup
      description: Join using only the code. Repeated joins preserve membership and timestamps. Body limit 8 KiB; 20 requests per actor per 10 minutes, independently of creation.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JoinGroupRequest'}
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/{groupId}:
    get:
      operationId: getGroup
      description: All members can read and share the join code. Existing groups return 403 to nonmembers; missing groups return 404.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/{groupId}/members:
    get:
      operationId: getGroupMembers
      description: Members only. Current profile projection, sorted by memberId ascending; no email or preferences. No membership row means no access.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: afterMemberId
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: A page of current members
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupMemberPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/register:
    post:
      operationId: register
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      responses:
        '204': {description: Logged out}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/profile:
    get:
      operationId: getProfile
      security:
        - CookieSession: []
      responses:
        '200':
          description: Current user's display profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: putProfile
      security:
        - CookieSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfile'}
      responses:
        '200':
          description: Replaced profile with incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/preferences:
    get:
      operationId: getPreferences
      security:
        - CookieSession: []
      responses:
        '200':
          description: Current user's preference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preference'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: putPreferences
      security:
        - CookieSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePreference'}
      responses:
        '200':
          description: Replaced preference with incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preference'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      operationId: me
      security:
        - CookieSession: []
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    get:
      operationId: ready
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: playpair_session
  parameters:
    OutingId:
      name: outingId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    InvitationCursor:
      name: cursor
      in: query
      schema: {type: string, minLength: 1, maxLength: 128}
    InvitationLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    GroupId:
      name: groupId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    BrowserWriteHeader:
      name: X-PlayPair-Request
      in: header
      required: true
      schema: {type: string, enum: ['1']}
  responses:
    OutingResponse:
      description: Outing visible to the authenticated group member
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Outing'}
    InvitationPageResponse:
      description: Invitation summaries without private inputs
      content:
        application/json:
          schema: {$ref: '#/components/schemas/InvitationPage'}
    GroupResponse:
      description: Group visible to the authenticated member
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Group'}
    UserResponse:
      description: Authenticated user
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/User'}
    Healthy:
      description: Available
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Error:
      description: Request failed
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateOutingRequest:
      type: object
      additionalProperties: false
      required: [dates, timezone, durationMinutes]
      properties:
        dates:
          type: array
          minItems: 1
          maxItems: 31
          items: {type: string, format: date}
        timezone: {type: string, minLength: 1, description: Publisher's explicit IANA timezone; immutable outing standard. Local and server defaults are forbidden.}
        durationMinutes: {type: integer, minimum: 30, maximum: 1440, multipleOf: 30}
    OutingStatus:
      type: string
      enum: [decision, confirmation, archived]
    InvitationPhase:
      type: string
      enum: [decision, confirmation]
    InvitationStatus:
      type: string
      enum: [pending, accepted, rejected, declined]
    Arrangement:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt, place, activity]
      properties:
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        place: {type: string, minLength: 1}
        activity: {type: string, minLength: 1}
    Outing:
      type: object
      additionalProperties: false
      required: [id, groupId, initiatorId, timezone, dates, durationMinutes, createdAt, status, arrangement, invitations]
      properties:
        id: {type: integer, format: int64}
        groupId: {type: integer, format: int64}
        initiatorId: {type: integer, format: int64}
        timezone: {type: string}
        dates: {type: array, items: {type: string, format: date}}
        durationMinutes: {type: integer}
        createdAt: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/OutingStatus'}
        arrangement:
          allOf: [{$ref: '#/components/schemas/Arrangement'}]
          nullable: true
        invitations:
          type: array
          description: Only the current user's rounds and input.
          items: {$ref: '#/components/schemas/Invitation'}
    Availability:
      type: object
      additionalProperties: false
      required: [date, startTime, endTime]
      description: Closed same-day interval in the outing timezone, start strictly before end. Overlaps and shared endpoints merge. Cross-day or reversed requests are rejected, never split. DST gaps and ambiguous wall times are rejected. 24:00 means next midnight and is allowed only as an end boundary.
      properties:
        date: {type: string, format: date}
        startTime: {type: string, pattern: '^([01][0-9]|2[0-3]):(00|30)$'}
        endTime: {type: string, pattern: '^(([01][0-9]|2[0-3]):(00|30)|24:00)$'}
    MemberInput:
      type: object
      additionalProperties: false
      required: [maxBudgetFen, requiresWheelchairAccess, availability]
      properties:
        maxBudgetFen: {type: integer, format: int64, minimum: 0, description: Explicit CNY budget in fen; zero is a valid zero-cost limit.}
        requiresWheelchairAccess: {type: boolean}
        availability:
          type: array
          minItems: 1
          maxItems: 256
          items: {$ref: '#/components/schemas/Availability'}
    RespondOutingRequest:
      type: object
      additionalProperties: false
      required: [status, expectedVersion]
      properties:
        status: {type: string, enum: [accepted, rejected, declined]}
        expectedVersion: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775806}
        input: {$ref: '#/components/schemas/MemberInput'}
    Invitation:
      type: object
      additionalProperties: false
      required: [outingId, memberId, phase, status, version, acceptedAt, updatedAt]
      properties:
        outingId: {type: integer, format: int64}
        memberId: {type: integer, format: int64}
        phase: {$ref: '#/components/schemas/InvitationPhase'}
        status: {$ref: '#/components/schemas/InvitationStatus'}
        version: {type: integer, format: int64}
        acceptedAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time}
        input: {$ref: '#/components/schemas/MemberInput'}
    InvitationPage:
      type: object
      additionalProperties: false
      required: [invitations]
      properties:
        invitations: {type: array, items: {$ref: '#/components/schemas/Invitation'}}
        nextCursor: {type: string}
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, description: Trim surrounding Unicode whitespace; reject NUL and invalid UTF-8.}
    JoinGroupRequest:
      type: object
      additionalProperties: false
      required: [joinCode]
      properties:
        joinCode: {type: string, description: Trim surrounding whitespace and uppercase ASCII before validating 16 Base32 characters. Never place in URLs or logs.}
    Group:
      type: object
      additionalProperties: false
      required: [id, name, joinCode, initiatorId, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 80}
        joinCode: {type: string, pattern: '^[A-Z2-7]{16}$'}
        initiatorId: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time, description: Latest actual group or membership change; nondecreasing but not a version or commit sequence.}
    GroupMember:
      type: object
      additionalProperties: false
      required: [memberId, role, joinedAt, displayName, nickname]
      properties:
        memberId: {type: integer, format: int64, minimum: 1}
        role: {type: string, enum: [initiator, member], description: Derived solely from the group initiatorId.}
        joinedAt: {type: string, format: date-time}
        displayName: {type: string}
        nickname: {type: string, nullable: true, description: Prefer nickname for display when present.}
    GroupMemberPage:
      type: object
      additionalProperties: false
      required: [members, nextAfterMemberId]
      properties:
        members:
          type: array
          items: {$ref: '#/components/schemas/GroupMember'}
        nextAfterMemberId: {type: integer, format: int64, nullable: true, description: Exclusive cursor; null when there is no next page.}
    SoftPreferences:
      type: object
      additionalProperties: false
      required: [likes, neutral, dislikes]
      properties:
        likes: {type: string, maxLength: 500}
        neutral: {type: string, maxLength: 500}
        dislikes: {type: string, maxLength: 500}
    HardDefaults:
      description: Optional defaults only; saving does not authorize any outing. Currency is CNY, measured in fen.
      type: object
      additionalProperties: false
      required: [maxBudgetFen, requiresWheelchairAccess]
      properties:
        maxBudgetFen: {type: integer, format: int64, minimum: 0, nullable: true}
        requiresWheelchairAccess: {type: boolean, nullable: true}
    Preference:
      type: object
      additionalProperties: false
      required: [soft, hardDefaults, version]
      properties:
        soft: {$ref: '#/components/schemas/SoftPreferences'}
        hardDefaults: {$ref: '#/components/schemas/HardDefaults'}
        version: {type: integer, format: int64, minimum: 1}
    UpdatePreference:
      type: object
      additionalProperties: false
      required: [soft, hardDefaults, expectedVersion]
      properties:
        soft: {$ref: '#/components/schemas/SoftPreferences'}
        hardDefaults: {$ref: '#/components/schemas/HardDefaults'}
        expectedVersion: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775806}
    Profile:
      type: object
      additionalProperties: false
      required: [displayName, nickname, version]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        nickname: {type: string, nullable: true, maxLength: 80}
        version: {type: integer, format: int64, minimum: 1}
    UpdateProfile:
      type: object
      additionalProperties: false
      required: [displayName, nickname, expectedVersion]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        nickname: {type: string, nullable: true, maxLength: 80}
        expectedVersion: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775806}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 15, maxLength: 512}
        displayName: {type: string, minLength: 1, maxLength: 320}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 15, maxLength: 512}
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, createdAt]
      properties:
        id: {type: integer, format: int64, minimum: 1, description: Database-generated account identity.}
        email: {type: string, format: email}
        displayName: {type: string, minLength: 1}
        createdAt: {type: string, format: date-time}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [invalid_availability, phase_conflict, outing_archived, invalid_input, idempotency_conflict, version_conflict, email_conflict, invalid_credentials, unauthenticated, forbidden, rate_limited, csrf_rejected, dependency_unavailable, not_found, method_not_allowed, internal_error]
            message: {type: string, minLength: 1}
            requestId: {type: string, minLength: 1}
