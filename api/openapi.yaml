openapi: 3.0.3
info:
  title: PlayPair API
  version: 0.1.0
paths:
  /api/v1/groups:
    post:
      operationId: createGroup
      description: Create a persistent friend group. Same actor/key/name replays without changing timestamps; a different normalized name returns 409 idempotency_conflict. Keys have no expiry. Body limit 8 KiB; 20 requests per actor per 10 minutes.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateGroupRequest'}
      responses:
        '201': {$ref: '#/components/responses/GroupResponse'}
        '200': {$ref: '#/components/responses/GroupResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/join:
    post:
      operationId: joinGroup
      description: Join using only the code. Repeated joins preserve membership and timestamps. Body limit 8 KiB; 20 requests per actor per 10 minutes, independently of creation.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JoinGroupRequest'}
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/{groupId}:
    get:
      operationId: getGroup
      description: All members can read and share the join code. Existing groups return 403 to nonmembers; missing groups return 404.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': {$ref: '#/components/responses/GroupResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/groups/{groupId}/members:
    get:
      operationId: getGroupMembers
      description: Members only. Current profile projection, sorted by memberId ascending; no email or preferences. No membership row means no access.
      security: [{CookieSession: []}]
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: afterMemberId
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: A page of current members
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupMemberPage'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/register:
    post:
      operationId: register
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      responses:
        '204': {description: Logged out}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/profile:
    get:
      operationId: getProfile
      security:
        - CookieSession: []
      responses:
        '200':
          description: Current user's display profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: putProfile
      security:
        - CookieSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfile'}
      responses:
        '200':
          description: Replaced profile with incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/preferences:
    get:
      operationId: getPreferences
      security:
        - CookieSession: []
      responses:
        '200':
          description: Current user's preference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preference'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: putPreferences
      security:
        - CookieSession: []
      parameters:
        - $ref: '#/components/parameters/BrowserWriteHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePreference'}
      responses:
        '200':
          description: Replaced preference with incremented version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preference'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      operationId: me
      security:
        - CookieSession: []
      responses:
        '200': {$ref: '#/components/responses/UserResponse'}
        default: {$ref: '#/components/responses/Error'}
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    get:
      operationId: ready
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: playpair_session
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    BrowserWriteHeader:
      name: X-PlayPair-Request
      in: header
      required: true
      schema: {type: string, enum: ['1']}
  responses:
    GroupResponse:
      description: Group visible to the authenticated member
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Group'}
    UserResponse:
      description: Authenticated user
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/User'}
    Healthy:
      description: Available
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Error:
      description: Request failed
      headers:
        X-Request-ID:
          schema: {type: string, minLength: 1}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, description: Trim surrounding Unicode whitespace; reject NUL and invalid UTF-8.}
    JoinGroupRequest:
      type: object
      additionalProperties: false
      required: [joinCode]
      properties:
        joinCode: {type: string, description: Trim surrounding whitespace and uppercase ASCII before validating 16 Base32 characters. Never place in URLs or logs.}
    Group:
      type: object
      additionalProperties: false
      required: [id, name, joinCode, initiatorId, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 80}
        joinCode: {type: string, pattern: '^[A-Z2-7]{16}$'}
        initiatorId: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time, description: Latest actual group or membership change; nondecreasing but not a version or commit sequence.}
    GroupMember:
      type: object
      additionalProperties: false
      required: [memberId, role, joinedAt, displayName, nickname]
      properties:
        memberId: {type: integer, format: int64, minimum: 1}
        role: {type: string, enum: [initiator, member], description: Derived solely from the group initiatorId.}
        joinedAt: {type: string, format: date-time}
        displayName: {type: string}
        nickname: {type: string, nullable: true, description: Prefer nickname for display when present.}
    GroupMemberPage:
      type: object
      additionalProperties: false
      required: [members, nextAfterMemberId]
      properties:
        members:
          type: array
          items: {$ref: '#/components/schemas/GroupMember'}
        nextAfterMemberId: {type: integer, format: int64, nullable: true, description: Exclusive cursor; null when there is no next page.}
    SoftPreferences:
      type: object
      additionalProperties: false
      required: [likes, neutral, dislikes]
      properties:
        likes: {type: string, maxLength: 500}
        neutral: {type: string, maxLength: 500}
        dislikes: {type: string, maxLength: 500}
    HardDefaults:
      description: Optional defaults only; saving does not authorize any outing. Currency is CNY, measured in fen.
      type: object
      additionalProperties: false
      required: [maxBudgetFen, requiresWheelchairAccess]
      properties:
        maxBudgetFen: {type: integer, format: int64, minimum: 0, nullable: true}
        requiresWheelchairAccess: {type: boolean, nullable: true}
    Preference:
      type: object
      additionalProperties: false
      required: [soft, hardDefaults, version]
      properties:
        soft: {$ref: '#/components/schemas/SoftPreferences'}
        hardDefaults: {$ref: '#/components/schemas/HardDefaults'}
        version: {type: integer, format: int64, minimum: 1}
    UpdatePreference:
      type: object
      additionalProperties: false
      required: [soft, hardDefaults, expectedVersion]
      properties:
        soft: {$ref: '#/components/schemas/SoftPreferences'}
        hardDefaults: {$ref: '#/components/schemas/HardDefaults'}
        expectedVersion: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775806}
    Profile:
      type: object
      additionalProperties: false
      required: [displayName, nickname, version]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        nickname: {type: string, nullable: true, maxLength: 80}
        version: {type: integer, format: int64, minimum: 1}
    UpdateProfile:
      type: object
      additionalProperties: false
      required: [displayName, nickname, expectedVersion]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        nickname: {type: string, nullable: true, maxLength: 80}
        expectedVersion: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775806}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 15, maxLength: 512}
        displayName: {type: string, minLength: 1, maxLength: 320}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 15, maxLength: 512}
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, createdAt]
      properties:
        id: {type: integer, format: int64, minimum: 1, description: Database-generated account identity.}
        email: {type: string, format: email}
        displayName: {type: string, minLength: 1}
        createdAt: {type: string, format: date-time}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok]}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [invalid_input, idempotency_conflict, version_conflict, email_conflict, invalid_credentials, unauthenticated, forbidden, rate_limited, csrf_rejected, dependency_unavailable, not_found, method_not_allowed, internal_error]
            message: {type: string, minLength: 1}
            requestId: {type: string, minLength: 1}
