services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: playpair
      POSTGRES_PASSWORD: playpair_dev
      POSTGRES_DB: playpair
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - playpair_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playpair -d playpair"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  playpair_pg_data:
