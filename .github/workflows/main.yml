name: Main Gate
on:
  push:
    branches: ["main"]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: playpair
          POSTGRES_PASSWORD: playpair_dev
          POSTGRES_DB: playpair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U playpair -d playpair_test"
          --health-interval=2s --health-timeout=2s --health-retries=15
    env:
      TEST_DATABASE_URL: postgres://playpair:playpair_dev@127.0.0.1:5432/playpair_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-integration
      - run: go test -race ./...
      - run: make test-smoke
